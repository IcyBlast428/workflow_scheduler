# Load under nginx's http context (e.g. /etc/nginx/conf.d/wfs.conf).
# Docker: publish host 8000 to container 8000. Replace server_name and proxy_pass for your site.
server {
    listen 8000;
    server_name wfs.example.com;

    client_max_body_size 64m;
    location / {
        proxy_pass http://192.0.2.10:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
