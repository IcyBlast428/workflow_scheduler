<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="960" viewBox="0 0 1560 960" role="img" aria-labelledby="title desc">
<title id="title">Workflow Scheduler 当前系统架构</title><desc id="desc">浏览器访问 Web，Web 将调度控制交给单实例 Scheduler，后者启动独立任务进程。GitLab 提供源码，Nexus 或离线 wheels 提供依赖，Nacos 提供平台连接配置。Web 和 Scheduler 共用 GaussDB/DWS 平台库与持久文件目录；任务按授权访问业务数据库。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#b4c2ce"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","WenQuanYi Zen Hei",sans-serif;fill:#edf1f4}.title{font-size:31px;font-weight:700}.label{font-size:24px;font-weight:700}.body{font-size:20px;fill:#bdc8d2}.small{font-size:17px;fill:#bdc8d2}.gold{fill:#e2bd70}.edge{fill:none;stroke:#b4c2ce;stroke-width:2;marker-end:url(#arrow)}.store{stroke-dasharray:6 5}</style>
<rect width="1560" height="960" rx="24" fill="#11171c"/>
<text x="50" y="58" class="title">Workflow Scheduler · 系统架构</text>
<text x="50" y="94" class="body">单机部署 / 单调度实例 / 任务版本与依赖隔离</text>
<text x="1510" y="55" class="small" text-anchor="end">代码基线 f2c0398 · 2026-11-15</text>
<rect x="450" y="260" width="660" height="585" rx="22" fill="#1a2229" stroke="#d6af62" stroke-opacity=".65"/>
<text x="474" y="829" class="small gold">一个 wfs.service → 启动监督器 → Web + Scheduler</text>
<rect x="480" y="135" width="600" height="92" rx="16" fill="#283130" stroke="#d6af62"/><text x="502" y="170" class="label gold">使用者 · 浏览器控制台</text><text x="502" y="202" class="body">Vue 3 页面 / Chrome、新版 Edge / 按角色授权</text><rect x="50" y="155" width="350" height="106" rx="16" fill="#202a33" stroke="#485968"/><text x="72" y="190" class="label">Nacos 配置中心</text><text x="72" y="222" class="body">向平台提供数据库连接配置</text><rect x="50" y="400" width="350" height="115" rx="16" fill="#202a33" stroke="#485968"/><text x="72" y="435" class="label">GitLab 任务代码</text><text x="72" y="467" class="body">扫描 → 获取指定提交 → 审查差异</text><rect x="50" y="565" width="350" height="114" rx="16" fill="#202a33" stroke="#485968"/><text x="72" y="600" class="label">Nexus / 离线 wheels</text><text x="72" y="632" class="body">准备每个任务版本的依赖环境</text><rect x="480" y="290" width="600" height="105" rx="16" fill="#202a33" stroke="#485968"/><text x="502" y="325" class="label">Web 服务 · Flask + Gunicorn</text><text x="502" y="357" class="body">默认 2 workers · 对外 HTTP 8008</text><rect x="480" y="470" width="600" height="142" rx="16" fill="#283130" stroke="#d6af62"/><text x="502" y="505" class="label gold">Scheduler · APScheduler</text><text x="502" y="537" class="body">固定 1 worker / 1 实例</text><text x="502" y="566" class="body">定时触发、持久队列、发布、并发与资源控制</text><rect x="480" y="695" width="600" height="101" rx="16" fill="#202a33" stroke="#485968"/><text x="502" y="730" class="label">独立 Python 任务进程</text><text x="502" y="762" class="body">固定代码版本 + 独立环境 + 公共 SDK</text><rect x="1170" y="290" width="340" height="143" rx="16" fill="#202a33" stroke="#485968"/><text x="1192" y="325" class="label">GaussDB / DWS 平台库</text><text x="1192" y="357" class="body">配置、账户、权限、执行历史</text><text x="1192" y="386" class="body">版本登记、队列、审计</text><rect x="1170" y="485" width="340" height="142" rx="16" fill="#202a33" stroke="#485968"/><text x="1192" y="520" class="label">共享持久文件</text><text x="1192" y="552" class="body">代码与环境、日志、业务输出</text><text x="1192" y="581" class="body">运行快照、指标、恢复记录</text><rect x="1170" y="695" width="340" height="101" rx="16" fill="#202a33" stroke="#485968"/><text x="1192" y="730" class="label">业务数据库 / 外部接口</text><text x="1192" y="762" class="body">业务库连接由平台明确授权</text><path d="M780 227V285" class="edge"/><text x="929" y="252" class="small" text-anchor="middle">登录会话 · 权限校验</text><path d="M400 207H425V342H475" class="edge"/><text x="213" y="287" class="small" text-anchor="middle">配置供平台读取</text><path d="M400 458H430V505H475" class="edge"/><path d="M400 622H430V576H475" class="edge"/><path d="M780 395V465" class="edge"/><text x="930" y="428" class="small" text-anchor="middle">内部 HTTP · 8009，仅本机访问</text><path d="M780 612V690" class="edge"/><text x="938" y="650" class="small" text-anchor="middle">申请执行名额 → 启动任务进程</text><path d="M1080 337H1165" class="edge store"/><path d="M1080 509H1138V406H1165" class="edge store"/><path d="M1080 555H1165" class="edge store"/><path d="M1080 742H1138V600H1165" class="edge store"/><path d="M1080 763H1165" class="edge"/><text x="1170" y="459" class="small">平台库通过 pyodbc + DWS ODBC 访问</text><text x="1170" y="657" class="small">Web / Scheduler 使用同一持久目录</text><text x="50" y="736" class="body">可选通知：邮件 / 短信网关</text><text x="50" y="770" class="small">按已配置规则发送失败与恢复通知</text><path d="M50 871H1510" stroke="#3c4a54"/><text x="50" y="907" class="body">生产目录 /data/workflow_scheduler · 平台数据库与任务使用的业务数据库分开管理</text><text x="50" y="937" class="small">实线：访问、控制或执行关系　虚线：持久数据读写（主图省略部分共用存储连线）</text></svg>