name: Verify platform
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-linux-py312.lock
      - run: python -m unittest discover -s tests -v
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-linux-py312.lock
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test && npm run build && npm run test:e2e && npm run test:e2e:gitlab
        working-directory: frontend
  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_DB: wfstest
          POSTGRES_USER: wfstest
          POSTGRES_PASSWORD: disposable-ci-database-password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U wfstest" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGDATABASE: wfstest
      PGPASSWORD: disposable-ci-database-password
      WFS_CI_POSTGRES: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y odbc-postgresql unixodbc
      - run: python -m pip install -r requirements-linux-py312.lock
      - run: python scripts/ci_postgres_acceptance.py
